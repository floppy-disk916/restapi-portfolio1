
#Ports:
# if you tell the port, the host machine can access it
# if not, it is still accessible between containers, but not the host

services:
  backend:
    build: .
    environment:
      - REDIS_URL= ${REDIS_URL}
      - DATABASE_URL= ${DOCKER_DB_URL}
      - PUBLIC_KEY=${PUBLIC_KEY}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGO=${JWT_ALGO}
      - JWT_EXPIRE_MIN=${JWT_EXPIRE_MIN}
      - API_KEY_EXPIRE_DAY=${API_KEY_EXPIRE_DAY}
      - OPENAPI_URL=${OPENAPI_URL}

    depends_on:
      database:
        condition: service_healthy  
      redis:
        condition: service_healthy
  

  redis:
    image: redis:latest
    volumes:
        - redis-data:/data
    restart: unless-stopped
    healthcheck:
        test: ["CMD-SHELL", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

  database:
    image: postgres:latest
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb

    volumes:
        - db-data:/var/lib/postgresql
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d restapi_db3"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restapi_db3

  proxy:
    image: caddy:alpine
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - $PWD/conf:/etc/caddy
      - $PWD/site:/srv
      - caddy_data:/data
      - caddy_config:/config
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC endpoint
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
    caddy_data:
    caddy_config:
    redis-data:
    db-data:
