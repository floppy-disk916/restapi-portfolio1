<!doctype HTML>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <meta charset="utf-8">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: "Geist", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }
        
    </style>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>

    <!-- START -->

    <div class="md:container">
        <div class="nav">
            <a class="nav-link" href="localhost:8000/">Home</a>
            <a role="button" class="nav-link" data-bs-toggle="menu" href="#">Docs</a>
            <div class="menu">
                <a class="menu-item" href="#">User</a>
                <div class="submenu">
                    <a class="menu-item" data-bs-toggle="menu" role="button" href="#">Dev</a>
                    <div class="menu">
                        <a class="menu-item" href="#">Internal</a>
                        <a class="menu-item" href="#">High level</a>
                    </div>
                </div>
            </div>
            <a class="nav-link" href="#">About</a>
        </div>
    </div>

    <div class="py-12 bg-primary container-fluid text-white">
        <h1>Admin Page</h1>
    </div>

    <section class="card m-10" style="max-width: 320px">
        <div class="card-body">
            <h4 class="card-title">API Key Registration</h4>
            <form 
                id="register-api-key" 
                hx-encoding="multipart/form-data" 
                hx-post="/admin/register"
                hx-target="#api-key"
            >
                <p id="api-key" class="fs-sm">your <strong>API Key</strong> will be shown here</p>
                <label for="emailForm" class="form-label">Email address</label>
                <input name="email" type="email" class="form-control" id="emailForm" placeholder="name@example.com">
                
                <label for="nameForm" class="form-label">Name</label>
                <input name="name" type="text" class="form-control" id="nameForm" placeholder="Ahmad">
                
                <label for="passwordForm" class="form-label">Password</label>
                <input name="password" type="password" class="form-control" id="passwordForm" aria-describedby="passwordHelpBlock">
                
                <button type="submit" class="btn-solid theme-primary px-10 m-2">Submit</button>
            </form>
        </div>
    </section>

    <!-- FINISH -->
    

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
