<!doctype HTML>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <meta charset="utf-8">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: "Geist", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }
        
    </style>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-response-targets@2.0.4" integrity="sha384-T41oglUPvXLGBVyRdZsVRxNWnOOqCynaPubjUVjxhsjFTKrFJGEMm3/0KGmNQ+Pg" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>

    <!-- START -->

    <div class="md:container">
        <div class="nav">
            <a class="nav-link" href="/">Home</a>
            <a role="button" class="nav-link" data-bs-toggle="menu" href="#">Docs</a>
            <div class="menu">
                <a class="menu-item" href="/docs/user">User</a>
                <a class="menu-item" href="/docs/dev">Dev</a>
            </div>
            <a class="nav-link" href="/about">About</a>
        </div>
    </div>

    <div class="py-8 bg-primary container-fluid text-white">
        <h1>{{ app_title }}</h1>
        <p>{{ app_description }}</p>
    </div>
    

    <div class="container d-flex flex-row flex-start flex-wrap m-10 w-15 gap-5">
        <div class="card hover-lift">
            <div 
            class="card-body"
            hx-ext="response-targets"    
            >
                <h2 class="card-title">Get Item</h2>
                <form
                    hx-get="/api/v1/item"
                    hx-target="#item-result"
                    hx-target-error="#any-error"
                    hx-swap="beforeend"
                >
                    <p class="bg-solid theme-primary"><strong id="item-result">Result</strong></p>
                    <label for="itemNameInput" class="form-label">Name</label>
                    <input id="itemNameInput" name="name" type="text" class="form-control"
                    placeholder="Type an item name and Enter..."/>
                    <div class="fw-bold m-2" id="any-error"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- FINISH -->

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
