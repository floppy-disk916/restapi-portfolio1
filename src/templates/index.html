<!doctype HTML>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <meta charset="utf-8">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: "Geist", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }
        
    </style>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

</head>
<body>

    <!-- START -->

    <div class="md:container">
        <div class="nav">
            <a class="nav-link" href="#">Home</a>
            <a role="button" class="nav-link" data-bs-toggle="menu" href="#">Docs</a>
            <div class="menu">
                <a class="menu-item" href="#">User</a>
                <div class="submenu">
                    <a class="menu-item" data-bs-toggle="menu" role="button" href="#">Dev</a>
                    <div class="menu">
                        <a class="menu-item" href="#">Internal</a>
                        <a class="menu-item" href="#">High level</a>
                    </div>
                </div>
            </div>
            <a class="nav-link" href="#">About</a>
        </div>
    </div>

    <div class="py-8 bg-primary container-fluid text-center text-white">
        <h1>Hello World</h1>
        <p>This is a text</p>
    </div>

    <div class="container text-start m-5">
        <h2>What is This?</h2>
        <p>This is a dummy page for bootstrap practice</p>
    </div>
    
    <div class="container text-start m-5">
        <h2>Can it be combined with jinja2 templates?</h2>
        <p>Yes</p>
    </div>

    <div class="d-flex flex-row gap-2 mx-8">
    {% for item in items %}
    <section class="card hover-lift">
        <div class="card-body">
        <h3 class="card-title">{{ item.name }}</h3>
        <p class="card-text">{{ item.description }}</p>
        <a role="button" class="btn-solid theme-primary" href="#">See more</a>
        </div>
    </section>
    {% endfor %}
    </div>
    <!-- FINISH -->

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
